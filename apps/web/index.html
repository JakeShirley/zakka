<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Zakka</title>
    <script>
      // Apply the cached UI theme before first paint to avoid a light flash.
      // Keep the storage key and theme list in sync with src/features/theme/themes.ts.
      (() => {
        const colorSchemes = { light: "light", dark: "dark", sakura: "light" };
        let preference = "system";
        try {
          preference = localStorage.getItem("scrapbook:ui-theme") ?? "system";
        } catch {}
        const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches;
        const theme = Object.hasOwn(colorSchemes, preference)
          ? preference
          : prefersDark
            ? "dark"
            : "light";
        document.documentElement.dataset.theme = theme;
        document.documentElement.style.colorScheme = colorSchemes[theme];
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
